name: Test offline generator

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'examples/**'
      - 'requirements.txt'
      - '.github/workflows/warp-masque.yml'
      - '.github/workflows/test-generator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/generate.py --account tests/fixtures/synthetic-account.json --settings examples/synthetic.json --check

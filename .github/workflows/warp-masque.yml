name: 生成 WARP MASQUE 配置

on:
  workflow_dispatch:
    inputs:
      mode:
        description: sample 是无效账号样例；account 复用账号；external-only 不需要账号
        type: choice
        options: [sample, account, external-only]
        default: sample
      include_external_nodes:
        description: 同时生成第三方非 MASQUE 节点配置（客户端运行时下载公开订阅）
        type: boolean
        default: true
      confirm_private_artifact:
        description: 已确认私有仓库成员可下载含私钥的配置
        type: boolean
        default: false

# No repository writes, registration, deployment, schedule, or automatic commits.
permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Require private repository and explicit account setup
        if: inputs.mode == 'account'
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          GENERATION_ENABLED: ${{ vars.WARP_GENERATION_ENABLED }}
          CONFIRMED: ${{ inputs.confirm_private_artifact }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ] || [ "$GENERATION_ENABLED" != "true" ] || [ "$CONFIRMED" != "true" ]; then
            echo "::error::Account generation requires a private repository, WARP_GENERATION_ENABLED=true, and artifact confirmation."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Generate nonfunctional sample
        if: inputs.mode == 'sample'
        env:
          INCLUDE_EXTERNAL_NODES: ${{ inputs.include_external_nodes }}
        run: |
          SETTINGS=examples/synthetic.json
          if [ "$INCLUDE_EXTERNAL_NODES" = "true" ]; then SETTINGS=examples/external-providers.json; fi
          python scripts/generate.py --account tests/fixtures/synthetic-account.json --settings "$SETTINGS" --output outputs
      - name: Generate external-node configuration without account input
        if: inputs.mode == 'external-only'
        run: python scripts/generate.py --external-only --settings examples/external-providers.json --output outputs
      - name: Reuse existing account (no registration)
        if: inputs.mode == 'account' && github.event.repository.private && vars.WARP_GENERATION_ENABLED == 'true' && inputs.confirm_private_artifact
        env:
          WARP_ACCOUNT_JSON: ${{ secrets.WARP_ACCOUNT_JSON }}
          INCLUDE_EXTERNAL_NODES: ${{ inputs.include_external_nodes }}
        run: |
          SETTINGS=examples/generator.json
          if [ "$INCLUDE_EXTERNAL_NODES" = "true" ]; then SETTINGS=examples/external-providers.json; fi
          python scripts/generate.py --account-env WARP_ACCOUNT_JSON --settings "$SETTINGS" --output outputs
      - name: Upload generated files
        if: success() && (inputs.mode == 'sample' || inputs.mode == 'external-only' || (github.event.repository.private && vars.WARP_GENERATION_ENABLED == 'true' && inputs.confirm_private_artifact))
        uses: actions/upload-artifact@v6
        with:
          name: warp-masque-${{ inputs.mode }}
          path: outputs/
          retention-days: 1
          if-no-files-found: error

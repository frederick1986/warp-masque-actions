name: 生成 WARP MASQUE 配置

on:
  workflow_dispatch:
    inputs:
      mode:
        description: sample 仅生成不可用测试样例；account 复用已有账号
        type: choice
        options: [sample, account]
        default: sample
      confirm_private_artifact:
        description: 已确认私有仓库成员可下载含私钥的配置
        type: boolean
        default: false

# No repository writes, registration, deployment, schedule, or automatic commits.
permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Require private repository and explicit account setup
        if: inputs.mode == 'account'
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          GENERATION_ENABLED: ${{ vars.WARP_GENERATION_ENABLED }}
          CONFIRMED: ${{ inputs.confirm_private_artifact }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ] || [ "$GENERATION_ENABLED" != "true" ] || [ "$CONFIRMED" != "true" ]; then
            echo "::error::Account generation requires a private repository, WARP_GENERATION_ENABLED=true, and artifact confirmation."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Generate nonfunctional sample
        if: inputs.mode == 'sample'
        run: python scripts/generate.py --account tests/fixtures/synthetic-account.json --settings examples/synthetic.json --output outputs
      - name: Reuse existing account (no registration)
        if: inputs.mode == 'account' && github.event.repository.private && vars.WARP_GENERATION_ENABLED == 'true' && inputs.confirm_private_artifact
        env:
          WARP_ACCOUNT_JSON: ${{ secrets.WARP_ACCOUNT_JSON }}
        run: python scripts/generate.py --account-env WARP_ACCOUNT_JSON --settings examples/generator.json --output outputs
      - name: Upload generated files
        if: success() && (inputs.mode == 'sample' || (github.event.repository.private && vars.WARP_GENERATION_ENABLED == 'true' && inputs.confirm_private_artifact))
        uses: actions/upload-artifact@v6
        with:
          name: warp-masque-${{ inputs.mode }}
          path: outputs/
          retention-days: 1
          if-no-files-found: error
